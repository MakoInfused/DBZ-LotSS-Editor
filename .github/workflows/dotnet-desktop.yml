# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, and zip a WPF or Windows Forms desktop application
# built on .NET Framework 4.7.1.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: .NET Framework Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass

    env:
      Solution_Name: "DBZ LotSS Editor.sln"
      Reverse_Engineering_Path: "../Reverse-Engineering-Toolkit"
      Reverse_Engineering_Solution_Name: "Reverse Engineering Toolkit.sln"
      Build_Configuration: "Release"
      App_Version: "0.75.0"
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Clone the external dependency where the solution expects it: adjacent to the editor, using the same parent folder
    - name: Clone Reverse-Engineering-Toolkit
      run: |
        # Clones the toolkit "up" one level from your workspace root
        git clone https://github.com/MakoInfused/Reverse-Engineering-Toolkit "${{ env.Reverse_Engineering_Path }}"

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Restore NuGet Packages
    - name: Restore NuGet Packages
      run: |
        nuget restore "${{ env.Reverse_Engineering_Path }}/${{ env.Reverse_Engineering_Solution_Name }}"
        nuget restore "${{ env.Solution_Name }}"

    # Build the application
    - name: Build the external toolkit dependencies FIRST, then build the main app
      run: |
        msbuild "${{ env.Reverse_Engineering_Path }}/${{ env.Reverse_Engineering_Solution_Name }}" /p:Configuration=${{ env.Build_Configuration }} /p:Platform="Any CPU" /m:1
        msbuild "${{ env.Solution_Name }}" /p:Configuration=${{ env.Build_Configuration }} /p:Platform="Any CPU"

    # Execute all unit tests in the solution, assumes it was built beforehand, otherwise a silent rebuild will trigger that crashes the workflow
    - name: Execute unit tests
      run: dotnet test "${{ env.Solution_Name }}" --configuration ${{ env.Build_Configuration }} --no-build

    # Extract version from AssemblyInfo.cs
    - name: Extract Version Number
      id: get_version
      run: |
        # Target the compiled executable directly inside your output release directory
        $exePath = "DBZ LotSS Editor/bin/${{ env.Build_Configuration }}/DBZ LotSS Editor.exe"
        
        if (Test-Path $exePath) {
            # Pulls the exact metadata out of the Windows binary file header
            $versionInfo = (Get-Item $exePath).VersionInfo
            $version = $versionInfo.ProductVersion.Trim()
            
            Write-Host "SUCCESS: Extracted version from binary ($exePath) -> $version" -ForegroundColor Green
            "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
            Write-Host "WARNING: Compiled .exe not found at $exePath. Keeping default fallback." -ForegroundColor Yellow
        }

    # Deploy the entire folder as a build artifact to GitHub
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DBZ-LotSS-Editor-Build-v${{ env.App_Version }}
        path: DBZ LotSS Editor/bin/${{ env.Build_Configuration }}/
