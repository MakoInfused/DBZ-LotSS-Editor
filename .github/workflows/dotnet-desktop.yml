# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, and zip a WPF or Windows Forms desktop application
# built on .NET Framework 4.7.1.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: .NET Framework Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: "DBZ LotSS Editor.sln"
      Build_Configuration: "Release"
      App_Version: "0.75.0"

    steps:
    # Checkout the code for the editor
    - name: Checkout Main Repository Code
      uses: actions/checkout@v4

    # 2. Download the toolkit in a temp folder
    - name: Checkout Reverse-Engineering-Toolkit Natively
      uses: actions/checkout@v4
      with:
        repository: 'MakoInfused/Reverse-Engineering-Toolkit'
        ref: 'main'
        path: 'temp-toolkit' # <- Stays within the safe workspace directory boundary

    # 3. Link Step: Use PowerShell to safely project the folder "up and out" exactly where our ..\..\ relative path looks for it
    - name: Link Toolkit to Parent Directory
      run: |
        # Creates a native folder connection up one level so your ..\..\ condition is fully satisfied
        New-Item -ItemType Junction -Path "../Reverse-Engineering-Toolkit" -Value "temp-toolkit"

    # Modern .NET core tooling required to process SDK-style projects natively
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4

    # Combined Restore & Compilation: This natively builds your solution and isolates 
    # the compiled desktop application outputs straight into a single local folder.
    - name: Build Application & Dependencies
      run: dotnet publish "${{ env.Solution_Name }}" --configuration ${{ env.Build_Configuration }} --output ./publish

    # Natively runs all unit tests across all project layers in the solution file
    - name: Execute unit tests
      run: dotnet test "${{ env.Solution_Name }}" --configuration ${{ env.Build_Configuration }} --no-build

    # Extract version dynamically from your compiled DLL file properties
    - name: Get Version Number
      id: get_version
      shell: pwsh
      run: |
        $dllPath = "./publish/DBZ LotSS Editor.dll"
        if (Test-Path $dllPath) {
            $version = (Get-Item $dllPath).VersionInfo.ProductVersion.Trim()
            echo "App_Version=$version" >> $env:GITHUB_ENV
        } else {
            echo "Compiled .exe not found at $exePath. Keeping default fallback."
        }

    # Uploads your completely built application folder
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DBZ-LotSS-Editor-Build-v${{ env.App_Version }}
        path: ./publish/
